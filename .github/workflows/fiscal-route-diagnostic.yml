name: Inspect fiscal regression timestamps
on:
  push:
    branches: [fix/contact-location-purge-oct08]
    paths: [.github/workflows/fiscal-route-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect published fiscal files without changes
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$task_dir/identity"
          ssh-keyscan -T 15 -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > "$task_dir/server_keys" 2>/dev/null
          test "$(ssh-keygen -lf "$task_dir/server_keys" | awk '{print $2}')" = 'SHA256:mNDWDdfOkgNeXMA6wNx/QkX81OagTOj3lq1aej7eVkg'
          ssh -i "$task_dir/identity" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/server_keys" -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import datetime,json,hashlib
          root=Path.home()/'domains/radargt.wowlatam.com/public_html'
          backups=Path.home()/'radar-deploy-backups'
          def inspect(p):
           if not p.is_file():return
           st=p.stat()
           print(json.dumps({'path':str(p.relative_to(Path.home())),'mtime_utc':datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat(),'bytes':st.st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}))
          for name in ['index.html','radar-app.html','radar-release.json','.htaccess','assets/index-BEaqfzxg.js','fiscales/index.html']:
           inspect(root/name)
          for folder in ['oct08-20261013T033100Z','oct08-20261008T082612Z','oct08-20261008T081924Z','fiscal-path-20260930T083424Z']:
           p=backups/folder
           for name in ['index.html','radar-app.html','radar-release.json','.htaccess','fiscales/index.html']:inspect(p/name)
           if (p/'manifest.json').exists():
            d=json.loads((p/'manifest.json').read_text());print('BACKUP_CONTENT',folder,'files',len(d.get('files',{})),'original_fiscal',d.get('original',{}).get('fiscales/index.html'),'expected',d.get('expected',{}))
          print('RECENT_ROOT_METADATA')
          for p in sorted(root.iterdir(),key=lambda x:x.stat().st_mtime,reverse=True)[:15]:
           st=p.stat();print(p.name,datetime.datetime.fromtimestamp(st.st_mtime,datetime.timezone.utc).isoformat())
                    PY
      - name: Check public routes
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,re,time
          for url in ['https://fiscales.wowlatam.com/','https://radargt.wowlatam.com/fiscales/','https://radargt.wowlatam.com/radar-release.json']:
            try:
              with urllib.request.urlopen(url+'?check='+str(time.time_ns()),timeout=20) as r:
                raw=r.read();print('PUBLIC',url,r.status,r.url,len(raw),hashlib.sha256(raw).hexdigest(),re.findall(r'<title>(.*?)</title>',raw.decode())[:1])
            except Exception as e:print('PUBLIC_ERROR',url,str(e))
          PY
