name: Hostinger connection preflight
on:
  push:
    branches: [ops/hostinger-connection-check]
    paths: [.github/workflows/hostinger-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate configuration and inspect public server identity
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$task_dir/identity"
          ssh-keygen -y -P '' -f "$task_dir/identity" > "$task_dir/public"
          echo 'Private key format valid; no authentication attempted.'
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > "$task_dir/server_keys" 2>/dev/null
          test -s "$task_dir/server_keys"
          observed=$(ssh-keygen -lf "$task_dir/server_keys" | awk '{print $2}')
          test "$observed" = 'SHA256:mNDWDdfOkgNeXMA6wNx/QkX81OagTOj3lq1aej7eVkg'
          ssh -i "$task_dir/identity" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/server_keys" "$SSH_USER@$SSH_HOST" 'python3 -' <<'PYREMOTE'
          from pathlib import Path
          import json,hashlib
          root=Path.home()/'domains/radargt.wowlatam.com/public_html'
          for name in ['assets/radar-access-gate-20260926.js','radar-app.html']:
              path=root/name
              print('PUBLIC_FILE '+json.dumps({'name':name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'content':path.read_text()}))
          PYREMOTE
