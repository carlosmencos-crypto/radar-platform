name: RADAR targeted login release
on:
  push:
    branches: [ops/hostinger-connection-check]
    paths: [.github/workflows/hostinger-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate configuration and inspect public server identity
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$task_dir/identity"
          ssh-keygen -y -P '' -f "$task_dir/identity" > "$task_dir/public"
          echo 'Private key format valid; no authentication attempted.'
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > "$task_dir/server_keys" 2>/dev/null
          test -s "$task_dir/server_keys"
          observed=$(ssh-keygen -lf "$task_dir/server_keys" | awk '{print $2}')
          test "$observed" = 'SHA256:mNDWDdfOkgNeXMA6wNx/QkX81OagTOj3lq1aej7eVkg'
          ssh -i "$task_dir/identity" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/server_keys" "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,os,datetime,fcntl
          payload=json.loads("{\"expected\":{\"index.html\":\"b646404afb5275dda70f3f0fb8c1de8978c51a9b1e5ef70336fa36ba0539f2b3\",\"radar-app.html\":\"47bcb2cfe71b3b30be3a8c616b59f79c2e0b796c1d6bcb61da79b3eb7729e442\"},\"files\":{\"landing-assets/radar-login-20260926.js\":\"/* RADAR landing authentication. Uses the same session contract as the municipal app. */\\n(() => {\\n const url='https://xxobbhnhxhcjkdxmjmwj.supabase.co';\\n const apikey='sb_publishable_dtvSaFdTJeZ1LAslek8Yjg_PVKGtDZn';\\n const key='radar-supabase-session-v1';\\n const form=document.querySelector('#login-form');const result=document.querySelector('#login-result');\\n if(!form||!result)return;\\n if(new URLSearchParams(location.search).get('login')==='1')document.querySelector('[data-login-open]')?.click();\\n form.addEventListener('submit',async event=>{\\n  event.preventDefault();event.stopImmediatePropagation();if(!form.reportValidity())return;\\n  const values=new FormData(form);const button=form.querySelector('button[type=\\\"submit\\\"]');button.disabled=true;result.textContent='Verificando tu acceso…';\\n  try{\\n   const response=await fetch(`${url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey,'Content-Type':'application/json'},body:JSON.stringify({email:String(values.get('email')||values.get('username')||'').trim(),password:String(values.get('password')||'')})});\\n   const payload=await response.json();if(!response.ok)throw new Error(response.status===429?'Espera unos minutos antes de volver a intentar.':'No pudimos iniciar sesión. Revisa tu correo y contraseña.');\\n   const session={access_token:payload.access_token,refresh_token:payload.refresh_token,expires_at:Date.now()+payload.expires_in*1000,token_type:payload.token_type};\\n   localStorage.setItem(key,JSON.stringify(session));\\n   localStorage.setItem('radar-session-persistence',values.get('remember')?'local':'session');\\n   sessionStorage.setItem('radar-session-tab','active');\\n   result.textContent='Acceso confirmado. Abriendo RADAR…';const next=new URLSearchParams(location.search).get('next');window.location.assign(next&&/^\\\\/(?:municipio\\\\/\\\\d{4}d?(?:\\\\/[a-z0-9-]+)?|\\\\d{4}d)(?:\\\\?[^#]*)?$/.test(next)?next:'/municipios');\\n  }catch(error){result.textContent=error.message||'No se pudo conectar. Intenta de nuevo.';button.disabled=false;}\\n },true);\\n})();\\n\\n\",\"assets/radar-access-gate-20260926.js\":\"/* Verify identity and municipal authorization before loading the existing app. */\\nconst url='https://xxobbhnhxhcjkdxmjmwj.supabase.co';\\nconst apikey='sb_publishable_dtvSaFdTJeZ1LAslek8Yjg_PVKGtDZn';\\nconst key='radar-supabase-session-v1';\\nconst entry='/assets/index-f2ULqrmd.js';\\nconst municipal=location.pathname.match(/^\\\\/municipio\\\\/(\\\\d{4})(d)?(?:\\\\/|$)/)||location.pathname.match(/^\\\\/(\\\\d{4})(d)(?:\\\\/|$)/);\\nconst protectedRoute=Boolean(municipal)||/^\\\\/(municipios|demos)\\\\/?$/.test(location.pathname);\\nfunction login(){localStorage.removeItem(key);location.replace(`/?login=1&next=${encodeURIComponent(location.pathname+location.search)}`);}\\nasync function verify(){\\n if(!protectedRoute)return true;\\n if(localStorage.getItem('radar-session-persistence')==='session'&&!sessionStorage.getItem('radar-session-tab')){login();return false;}\\n let session;try{session=JSON.parse(localStorage.getItem(key)||'null');}catch{login();return false;}\\n if(!session?.access_token){login();return false;}\\n if(session.expires_at<=Date.now()+60000){\\n  const response=await fetch(`${url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});\\n  if(!response.ok){login();return false;}const data=await response.json();session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000,token_type:data.token_type};localStorage.setItem(key,JSON.stringify(session));\\n }\\n const headers={apikey,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'};\\n const identity=await fetch(`${url}/auth/v1/user`,{headers});if(!identity.ok){login();return false;}\\n if(municipal){const demo=Boolean(municipal[2])||new URLSearchParams(location.search).get('demo')==='1';const response=await fetch(`${url}/rest/v1/rpc/radar_authorized_context_v2`,{method:'POST',headers,body:JSON.stringify({route_kind:demo?'demo':'municipality',route_key:municipal[1]})});const data=await response.json();if(!response.ok||!Array.isArray(data)||!data.length){showError('Tu cuenta no tiene acceso a este municipio.');return false;}}\\n return true;\\n}\\nfunction showError(message){document.body.replaceChildren();const panel=document.createElement('main');panel.style.cssText='max-width:560px;margin:15vh auto;padding:32px;font:18px system-ui;line-height:1.7';const title=document.createElement('h1');title.textContent='Acceso RADAR';const description=document.createElement('p');description.textContent=message;const link=document.createElement('a');link.href='/?login=1';link.textContent='Volver al ingreso';panel.append(title,description,link);document.body.append(panel);}\\ndocument.addEventListener('click',async event=>{const element=event.target instanceof Element?event.target.closest('a,button'):null;if(!element)return;if(element.textContent?.trim()!=='Cerrar sesión'&&!element.getAttribute('href')?.includes('signout-with-chatgpt'))return;event.preventDefault();event.stopImmediatePropagation();let session;try{session=JSON.parse(localStorage.getItem(key)||'null');}catch{}localStorage.removeItem(key);sessionStorage.removeItem('radar-session-tab');sessionStorage.removeItem('radar-supabase-callback-v1');try{if(session?.access_token)await fetch(`${url}/auth/v1/logout`,{method:'POST',headers:{apikey,Authorization:`Bearer ${session.access_token}`},signal:AbortSignal.timeout(5000)});}catch{}location.replace('/?login=1');},true);\\nwindow.addEventListener('pageshow',event=>{if(event.persisted&&protectedRoute)location.reload();});\\ntry{if(await verify())await import(entry);}catch{showError('No pudimos verificar el acceso. Revisa tu conexión y vuelve a intentar.');}\\n\\n\",\"index.html\":\"<!doctype html>\\n<html lang=\\\"es\\\">\\n<head>\\n  <meta charset=\\\"utf-8\\\">\\n  <meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n  <meta name=\\\"theme-color\\\" content=\\\"#20262c\\\">\\n  <meta name=\\\"description\\\" content=\\\"RADAR organiza la inteligencia, el territorio y la operación de una campaña en una sola memoria estratégica.\\\">\\n  <title>RADAR · Inteligencia Electoral</title>\\n  <link rel=\\\"icon\\\" href=\\\"/landing-assets/favicon.png\\\" type=\\\"image/png\\\">\\n  <link rel=\\\"stylesheet\\\" href=\\\"/landing-assets/styles.css\\\">\\n</head>\\n<body>\\n  <a class=\\\"skip-link\\\" href=\\\"#contenido\\\">Saltar al contenido</a>\\n\\n  <header class=\\\"site-header\\\">\\n    <a class=\\\"brand\\\" href=\\\"#inicio\\\" aria-label=\\\"RADAR, inicio\\\">\\n      <img src=\\\"/landing-assets/brand/logo-claro.svg\\\" alt=\\\"RADAR Inteligencia Electoral\\\">\\n    </a>\\n\\n    <button class=\\\"menu-toggle\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"main-nav\\\" aria-label=\\\"Abrir menú\\\">\\n      <span></span><span></span>\\n    </button>\\n\\n    <nav class=\\\"main-nav\\\" id=\\\"main-nav\\\" aria-label=\\\"Navegación principal\\\">\\n      <a href=\\\"#inicio\\\">RADAR</a>\\n      <a href=\\\"#contacto\\\">Contacto</a>\\n      <a href=\\\"#productos\\\">Productos</a>\\n    </nav>\\n\\n    <div class=\\\"header-actions\\\">\\n      <div class=\\\"market-picker\\\">\\n        <button class=\\\"market-trigger\\\" type=\\\"button\\\" aria-expanded=\\\"false\\\" aria-controls=\\\"market-menu\\\">\\n          <span class=\\\"market-flag\\\" aria-hidden=\\\"true\\\">🇬🇹</span>\\n          <span class=\\\"market-code\\\">GT</span>\\n          <span class=\\\"market-name\\\">Guatemala</span>\\n          <span class=\\\"market-chevron\\\" aria-hidden=\\\"true\\\">⌄</span>\\n        </button>\\n        <div class=\\\"market-menu\\\" id=\\\"market-menu\\\" role=\\\"menu\\\" hidden>\\n          <div class=\\\"market-menu-head\\\">\\n            <span>RADAR Latinoamérica</span>\\n            <small>Selecciona un país</small>\\n          </div>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"GT\\\" data-country=\\\"Guatemala\\\" data-flag=\\\"🇬🇹\\\"><i>🇬🇹</i><b>GT</b><span>Guatemala</span><em>Disponible</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"HN\\\" data-country=\\\"Honduras\\\" data-flag=\\\"🇭🇳\\\"><i>🇭🇳</i><b>HN</b><span>Honduras</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"CR\\\" data-country=\\\"Costa Rica\\\" data-flag=\\\"🇨🇷\\\"><i>🇨🇷</i><b>CR</b><span>Costa Rica</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"SV\\\" data-country=\\\"El Salvador\\\" data-flag=\\\"🇸🇻\\\"><i>🇸🇻</i><b>SV</b><span>El Salvador</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"NI\\\" data-country=\\\"Nicaragua\\\" data-flag=\\\"🇳🇮\\\"><i>🇳🇮</i><b>NI</b><span>Nicaragua</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"PA\\\" data-country=\\\"Panamá\\\" data-flag=\\\"🇵🇦\\\"><i>🇵🇦</i><b>PA</b><span>Panamá</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"CO\\\" data-country=\\\"Colombia\\\" data-flag=\\\"🇨🇴\\\"><i>🇨🇴</i><b>CO</b><span>Colombia</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"PE\\\" data-country=\\\"Perú\\\" data-flag=\\\"🇵🇪\\\"><i>🇵🇪</i><b>PE</b><span>Perú</span><em>Expansión</em></button>\\n          <button type=\\\"button\\\" role=\\\"menuitem\\\" data-code=\\\"MX\\\" data-country=\\\"México\\\" data-flag=\\\"🇲🇽\\\"><i>🇲🇽</i><b>MX</b><span>México</span><em>Expansión</em></button>\\n        </div>\\n      </div>\\n      <button class=\\\"client-link\\\" type=\\\"button\\\" data-login-open>Login</button>\\n      <a class=\\\"button button-dark button-small header-demo\\\" href=\\\"#contacto\\\">Solicitar demo</a>\\n    </div>\\n  </header>\\n\\n  <main id=\\\"contenido\\\">\\n    <section class=\\\"hero\\\" id=\\\"inicio\\\">\\n      <div class=\\\"particle-field\\\" data-parallax=\\\"18\\\" aria-hidden=\\\"true\\\"></div>\\n      <div class=\\\"hero-inner reveal\\\">\\n        <p class=\\\"eyebrow\\\"><span></span> RADAR ELECTORAL / CAMPAÑA 2027</p>\\n        <h1 data-parallax=\\\"16\\\">Una campaña sin memoria<br><span>repite sus errores.</span></h1>\\n        <p class=\\\"hero-manifesto\\\">La estrategia no improvisa.</p>\\n        <p class=\\\"hero-lead\\\">RADAR convierte cada dato, visita, acuerdo y resultado en memoria estratégica para decidir con más claridad y operar con menos improvisación.</p>\\n        <div class=\\\"hero-actions\\\">\\n          <a class=\\\"button button-primary\\\" href=\\\"#plataforma\\\">Ver RADAR en acción <span>↘</span></a>\\n          <a class=\\\"button button-outline\\\" href=\\\"#disponibilidad\\\">Consultar mi municipio</a>\\n        </div>\\n        <div class=\\\"hero-proof\\\" aria-label=\\\"Principios de RADAR\\\">\\n          <span><i></i> Datos con fuente</span>\\n          <span><i></i> Operación privada</span>\\n          <span><i></i> Exclusividad municipal</span>\\n        </div>\\n      </div>\\n    </section>\\n\\n    <section class=\\\"why section-paper\\\" id=\\\"por-que\\\">\\n      <div class=\\\"section-particles\\\" data-parallax=\\\"12\\\" aria-hidden=\\\"true\\\"></div>\\n      <header class=\\\"section-intro reveal\\\">\\n        <div>\\n          <h2>¿Por qué RADAR?</h2>\\n          <p>Porque una campaña no debería empezar de cero cada mañana.</p>\\n        </div>\\n      </header>\\n\\n      <div class=\\\"collage-story reveal\\\">\\n        <img src=\\\"/landing-assets/visuals/campaign-collage.webp\\\" data-parallax=\\\"22\\\" alt=\\\"Información de campaña dispersa entre chats, hojas de cálculo, agenda y notas\\\">\\n        <p>La información electoral suele existir, pero vive separada: una hoja de cálculo, un chat, una libreta, una llamada. RADAR reúne ese conocimiento y lo convierte en una forma sencilla de ver, coordinar y decidir.</p>\\n      </div>\\n\\n      <div class=\\\"memory-lines reveal\\\">\\n        <article>\\n          <span>01</span>\\n          <h3>Memoria</h3>\\n          <p>Personas, acuerdos, fuentes y decisiones conservan historia y contexto.</p>\\n          <small>Lo aprendido no se pierde.</small>\\n        </article>\\n        <article>\\n          <span>02</span>\\n          <h3>Territorio</h3>\\n          <p>Municipios, comunidades, centros y actividad de campo se leen juntos.</p>\\n          <small>El mapa deja de ser decoración.</small>\\n        </article>\\n        <article>\\n          <span>03</span>\\n          <h3>Control</h3>\\n          <p>Responsables, agenda, recursos y Día D comparten una sola operación.</p>\\n          <small>La estrategia llega a la calle.</small>\\n        </article>\\n      </div>\\n    </section>\\n\\n    <section class=\\\"dashboard-band section-petrol\\\" id=\\\"plataforma\\\">\\n      <div class=\\\"micro-particles\\\" data-parallax=\\\"20\\\" aria-hidden=\\\"true\\\"></div>\\n      <div class=\\\"dashboard-copy reveal\\\">\\n        <h2>Un dashboard para organizar todo lo que ocurre antes, durante y después de la elección.</h2>\\n      </div>\\n      <div class=\\\"dashboard-device\\\">\\n        <img src=\\\"/landing-assets/visuals/radar-laptop.webp\\\" alt=\\\"Laptop mostrando el Mapa Inteligente real de RADAR\\\">\\n      </div>\\n    </section>\\n\\n    <section class=\\\"modules section-paper\\\" aria-label=\\\"Módulos de RADAR\\\">\\n      <div class=\\\"module-list reveal\\\">\\n        <article><span>01</span><h3>Inteligencia Municipal</h3><p>La fotografía social, territorial, electoral y financiera del municipio.</p></article>\\n        <article><span>02</span><h3>Estrategia</h3><p>Prioridades, escenarios y líneas de acción dentro de un mismo contexto.</p></article>\\n        <article><span>03</span><h3>Directorio</h3><p>Personas, liderazgos, equipos e historial de relación con el territorio.</p></article>\\n        <article><span>04</span><h3>Agenda</h3><p>Actividades, responsables, compromisos y calendario electoral conectado.</p></article>\\n        <article><span>05</span><h3>Mapa Inteligente</h3><p>Comunidades, centros, infraestructura y actividad vistos geográficamente.</p></article>\\n        <article><span>06</span><h3>Día D</h3><p>Mesas, fiscales, incidencias, actas y RTD para el centro de control.</p></article>\\n        <article><span>07</span><h3>Recursos</h3><p>Asignación y seguimiento para saber qué se entregó, dónde y a quién.</p></article>\\n        <article><span>08</span><h3>Pulso e IA RADAR</h3><p>Lecturas ejecutivas y asistencia para explorar información con contexto.</p></article>\\n      </div>\\n    </section>\\n\\n    <section class=\\\"phone-band section-purple\\\">\\n      <div class=\\\"micro-particles\\\" data-parallax=\\\"20\\\" aria-hidden=\\\"true\\\"></div>\\n      <div class=\\\"phone-device\\\">\\n        <img src=\\\"/landing-assets/visuals/radar-phone.webp\\\" alt=\\\"Celular mostrando la agenda móvil real de RADAR\\\">\\n      </div>\\n      <div class=\\\"phone-copy reveal\\\" data-delay=\\\"1\\\">\\n        <p class=\\\"eyebrow eyebrow-light\\\">CAMPAÑA CONECTADA</p>\\n        <h2>De la campaña tradicional a una operación con lógica y memoria.</h2>\\n      </div>\\n    </section>\\n\\n    <section class=\\\"comparison\\\" id=\\\"comparativo\\\" aria-label=\\\"Comparación entre campaña tradicional y RADAR\\\">\\n      <h2 class=\\\"comparison-title reveal\\\">Cambiamos la forma de hacer campaña</h2>\\n      <div class=\\\"comparison-table reveal\\\">\\n        <div class=\\\"comparison-head\\\">\\n          <span>Campaña tradicional</span>\\n          <span>RADAR</span>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>Contactos repartidos entre teléfonos, chats y archivos</span></div>\\n          <div><i>✓</i><span>Cada persona con territorio, historial, responsable y próxima acción</span></div>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>Reportes de campo que llegan tarde o sin evidencia</span></div>\\n          <div><i>✓</i><span>Actividad vinculada a lugar, fecha, equipo y seguimiento</span></div>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>Datos públicos consultados en fuentes separadas</span></div>\\n          <div><i>✓</i><span>Información institucional organizada con fuente, periodo y universo</span></div>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>Agenda, territorio y recursos avanzan por caminos distintos</span></div>\\n          <div><i>✓</i><span>Una operación conectada con responsables y prioridades visibles</span></div>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>El Día D se arma con controles de última hora</span></div>\\n          <div><i>✓</i><span>Centros, mesas, fiscales, incidencias y RTD en una misma capa</span></div>\\n        </div>\\n        <div class=\\\"comparison-row\\\">\\n          <div><i>—</i><span>Al terminar el proceso, el aprendizaje se dispersa</span></div>\\n          <div><i>✓</i><span>La organización conserva una memoria útil para el siguiente ciclo</span></div>\\n        </div>\\n      </div>\\n    </section>\\n\\n    <section class=\\\"conversion\\\" id=\\\"contacto\\\">\\n      <div class=\\\"exclusive-panel\\\" id=\\\"disponibilidad\\\">\\n        <div class=\\\"conversion-heading reveal\\\">\\n          <p class=\\\"eyebrow eyebrow-light\\\">EXCLUSIVIDAD TERRITORIAL</p>\\n          <h2>Un municipio.<br>Una campaña.<br><span>Un solo RADAR.</span></h2>\\n          <p>Trabajamos con una sola campaña por municipio durante el proceso electoral. La ventaja estratégica no se comparte.</p>\\n          <small>La exclusividad se confirma al formalizar la incorporación. Una consulta no reserva el territorio.</small>\\n        </div>\\n        <form class=\\\"compact-form reveal\\\" id=\\\"availability-form\\\" novalidate>\\n          <h3>Consulta tu municipio</h3>\\n          <label>País\\n            <select name=\\\"country\\\" required>\\n              <option>Guatemala</option><option>Honduras</option><option>Costa Rica</option><option>El Salvador</option><option>Nicaragua</option><option>Panamá</option><option>Colombia</option><option>Perú</option><option>México</option>\\n            </select>\\n          </label>\\n          <div class=\\\"field-row availability-fields\\\">\\n            <label>Departamento o región<input name=\\\"region\\\" autocomplete=\\\"address-level1\\\" placeholder=\\\"Ej. Escuintla\\\" required></label>\\n            <label>Municipio<input name=\\\"municipality\\\" autocomplete=\\\"address-level2\\\" placeholder=\\\"Ej. San José\\\" required></label>\\n          </div>\\n          <label>Campaña\\n            <select name=\\\"campaign\\\" required>\\n              <option value=\\\"\\\">Seleccionar ciclo</option>\\n              <option>2027</option>\\n              <option>2031</option>\\n            </select>\\n          </label>\\n          <button class=\\\"button button-primary button-full\\\" type=\\\"submit\\\">Verificar disponibilidad <span>→</span></button>\\n          <div class=\\\"form-result\\\" id=\\\"availability-result\\\" role=\\\"status\\\" aria-live=\\\"polite\\\"></div>\\n          <small>La ide