name: Build and update deploy-hostinger

on:
  push:
    branches:
      - fix/favicon-radar

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/favicon-radar
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production
        run: npm run build

      - name: Test and audit
        run: npm test

      - name: Verify smoke and bundle audit
        run: |
          npm run smoke:340
          npm run audit:bundle

      - name: Prepare deploy-hostinger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/radar-deploy
          git clone --branch deploy-hostinger --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/radar-deploy
          find /tmp/radar-deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/radar-deploy/
          cd /tmp/radar-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "DEPLOY_HOSTINGER_UNCHANGED"; exit 0; }
          git commit -m "deploy: RADAR production build from fix/favicon-radar"
          git push origin HEAD:deploy-hostinger

      - name: Verify deploy branch ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git ls-remote origin refs/heads/deploy-hostinger
