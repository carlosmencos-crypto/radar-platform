name: Temporary RADAR private auth preview
# Source: feature/private-auth-supabase

on:
  push:
    branches:
      - preview/private-auth-supabase
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-private-auth-supabase-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:340
      - run: npm run build -- --base=/radar-platform/
      - run: npm run audit:bundle
      - name: Prepare isolated SPA preview
        run: |
          sed -i 's|/brand/|/radar-platform/brand/|g' dist/assets/*.js
          cp dist/index.html dist/404.html
          for route in login municipios demo/valle-nexo municipio/0509 municipio/1901; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: private-auth-supabase-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated auth preview
        id: deployment
        uses: actions/deploy-pages@v4
