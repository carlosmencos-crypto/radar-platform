name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:340
      - run: node scripts/smoke-v70-parity.mjs
      - run: npm run build
      - run: node scripts/smoke-preview.mjs
      - run: npm run audit:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: v70-parity-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
