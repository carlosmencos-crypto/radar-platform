name: Quality

on:
  pull_request:
  push:
    branches: [main, qa/v70-golden-electoral-runtime, qa/v70-sibinal-client-preview, qa/v70-national-client-readiness]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:xlsx
      - run: npm run smoke:340
      - run: npm run smoke-v70-parity
      - run: npm run build
      - run: node scripts/smoke-preview.mjs
      - run: npm run audit:bundle
      - name: Build isolated 0509 browser render bundle
        run: npm run build -- --outDir dist-render
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4179/mock
          VITE_SUPABASE_PUBLISHABLE_KEY: qa-render-publishable
      - name: Render all 0509 routes without white-screen regressions
        run: node scripts/render-smoke-0509.mjs
      - name: Render all 1208 routes with municipal isolation checks
        run: RADAR_RENDER_MUNICIPALITY_CODE=1208 node scripts/render-smoke-0509.mjs
      - name: Render stratified large municipality sample 0101
        run: RADAR_RENDER_MUNICIPALITY_CODE=0101 node scripts/render-smoke-0509.mjs
      - name: Render stratified medium municipality sample 1901
        run: RADAR_RENDER_MUNICIPALITY_CODE=1901 node scripts/render-smoke-0509.mjs
      - name: Verify Fraijanes public history on desktop and mobile
        run: RADAR_RENDER_MUNICIPALITY_CODE=0113 RADAR_RENDER_HISTORY_ONLY=1 node scripts/render-smoke-0509.mjs
      - name: Exercise 0509 SPA navigation, report modal and printable report
        run: node scripts/render-interaction-0509-canonical.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-render-smoke-0509
          path: render-smoke-0509
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-render-smoke-1208
          path: render-smoke-1208
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-render-smoke-stratified
          path: |
            render-smoke-0101
            render-smoke-1901
            render-smoke-0113
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-interaction-smoke-0509
          path: render-interaction-0509
          if-no-files-found: error
          retention-days: 1
      - run: rm -rf dist-render
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-parity-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
